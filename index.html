<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no">
  <title>Chroma Frontier</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1d2a44; overflow: hidden; touch-action: none; }
    /* 9:16 세로 비율을 유지하면서 화면에 꽉 맞춘다 (남는 쪽은 레터박스). */
    #unity-canvas, #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(100vw, calc(100vh * 9 / 16)); height: min(100vh, calc(100vw * 16 / 9));
    }
    #unity-canvas { background: #5c9edb; outline: none; }
    /* 로딩 화면: 게임 스플래시와 같은 바다색 배경 + 제목 + 진행 바 */
    #loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vmin;
      background: linear-gradient(#7fd3f5, #4fb4ea 55%, #3a8fd6);
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #fff;
      transition: opacity .4s;
    }
    #loading .orbs { display: flex; gap: 2.4vmin; margin-bottom: 1vmin; }
    #loading .orb {
      width: 6vmin; height: 6vmin; border-radius: 50%; border: .5vmin solid #2a1838;
      animation: bob 1.2s ease-in-out infinite;
    }
    #loading .orb:nth-child(1) { background: radial-gradient(circle at 35% 30%, #ffd0a0, #e2381a); }
    #loading .orb:nth-child(2) { background: radial-gradient(circle at 35% 30%, #bfe8ff, #1f6fd8); animation-delay: .2s; }
    #loading .orb:nth-child(3) { background: radial-gradient(circle at 35% 30%, #fff3a0, #e8a01f); animation-delay: .4s; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6vmin); } }
    #loading .logo { width: 82%; max-width: 480px; height: auto; }
    #loading .sub { font-size: 2vmin; font-weight: 700; text-shadow: 0 .3vmin 0 #1c2a5a; }
    #loading .bar {
      width: 52%; height: 2.4vmin; margin-top: 2vmin; border-radius: 2vmin;
      background: #1c2a44; border: .4vmin solid #fff; box-shadow: 0 .4vmin 0 rgba(0,0,0,.25); overflow: hidden;
    }
    #loading .fill { height: 100%; width: 0; border-radius: 2vmin; background: linear-gradient(90deg, #3d8ff0, #ffd23a, #ef4f4f); transition: width .2s; }
    #loading .pct { font-size: 1.8vmin; opacity: .9; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <div class="orbs"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
    <img class="logo" src="logo.png" alt="Chroma Frontier">
    <div class="sub">원소를 섞어 땅을 빼앗아라!</div>
    <div class="bar"><div class="fill"></div></div>
    <div class="pct">불러오는 중 0%</div>
  </div>
  <script src="Build/01433eb96b9633a1b98779e5bf6c5672.loader.js"></script>
  <script>
    const loading = document.querySelector('#loading');
    const fill = loading.querySelector('.fill');
    const pct = loading.querySelector('.pct');
    createUnityInstance(document.querySelector('#unity-canvas'), {
      dataUrl: 'Build/256d38e93a77f56ae31d7c51d1363fa6.data.unityweb',
      frameworkUrl: 'Build/1a69e8ef591516f7f5a266da560ef08a.framework.js.unityweb',
      codeUrl: 'Build/89ff19aa9399e486d5fe60fa0c095438.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "ChromaFrontier",
      productName: "Chroma Frontier",
      productVersion: "0.1.0",
    }, (p) => {
      fill.style.width = `${Math.round(p * 100)}%`;
      pct.textContent = `불러오는 중 ${Math.round(p * 100)}%`;
    })
      .then(() => { loading.style.opacity = '0'; setTimeout(() => loading.remove(), 400); })
      .catch((e) => { pct.textContent = e; });
  </script>
</body>
</html>
